# Dependabot will run on day 22 of each month at 03:26 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '26 3 22 * *'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - 'Voodoo2man'
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '26 3 22 * *'
    open-pull-requests-limit: 15
    assignees:
      - 'Voodoo2man'
